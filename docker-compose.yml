services:
  kongo:
    # The published image; `build: .` builds it from this folder instead (docker compose up -d --build)
    image: bassidus/kongo:latest
    build: .
    container_name: kongo
    restart: unless-stopped
    # Host network/PID namespaces so the page sees the real NIC counters and all host processes
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      # Set TZ in .env (not committed), e.g. TZ=Europe/London
      - TZ=${TZ:-Etc/UTC}
      - PORT=8090
      # Comma-separated interface list; empty = all physical NICs
      - NET_IFACES=
      # Public IP for the System panel, fetched every 30 min; empty = off
      - PUBLIC_IP_URL=https://api.ipify.org
      # Refresh the host's package lists when they are older than this many hours; 0 = only read them
      - UPDATES_REFRESH_HOURS=12
      # Ask the registries whether running containers' images have newer versions this often; 0 = off
      - CONTAINER_UPDATES_HOURS=12
      # "Install updates" and "Restart" buttons, behind the password of a Linux admin user (sudo/wheel group).
      # The page has no TLS, so the password crosses the network in clear text: only on a LAN you trust.
      - ADMIN_ACTIONS=on
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      # Container names for the per-container network panel (config.v2.json)
      - /var/lib/docker/containers:/host/docker-containers:ro
